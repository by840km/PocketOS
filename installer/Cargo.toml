[package]
name = "pocketos-installer"
version = "0.4.0-beta.1"
edition = "2021"

[[bin]]
name = "PocketOS-Setup"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

